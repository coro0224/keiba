<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{{title}}（G{{grade}}）</title>
  <link rel="stylesheet" href="styles-race.css" />
</head>
<body>
  <article class="race-detail">

    <!-- 🏇 レース画像＆ヘッダー -->
    <div class="race-header">
      <img src="images/{{image_name}}" alt="{{title}} G{{grade}}" class="race-mainvisual" />

      <div class="race-meta">
        <h1 class="race-title-main">
          {{title}} <span class="grade-label g{{grade}}">G{{grade}}</span>
        </h1>
        <div class="race-subgroup">
          <p class="race-date">{{date}}（{{weekday}}）</p>
          <p class="race-location">{{venue}}・{{surface}}{{distance}}</p>
        </div>
      </div>
    </div>

    <!-- 🎯 見どころ -->
    <section class="race-section highlight">
      <h3>🎯 見どころ</h3>
      <p>{{highlight}}</p>
    </section>

    <!-- 📊 展開予想 -->
    <section class="race-section preview">
      <h3>📊 展開予想</h3>
      <p>{{preview}}</p>

      <div class="note-cta">
        {{note_link}}
      </div>
    </section>

    <!-- 🐎 レース回顧 -->
    <section class="race-section review">
      <h3>🐎 レース回顧</h3>
      <p>{{review}}</p>
    </section>

    <footer>
      <a href="index.html">🏠 トップページへ戻る</a>
    </footer>
  </article>
</body>
</html>
