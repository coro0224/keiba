<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>根岸ステークス（GG3）</title>
  <link rel="stylesheet" href="../styles-race.css" />
  <link rel="stylesheet" href="../common.css" />
</head>
<body>
  <article class="race-detail">

    <!-- 🏇 レース画像＆ヘッダー -->
    <div class="race-header">
      <img src="../images/{{image_name}}" alt="根岸ステークス G3" class="race-mainvisual" />

      <div class="race-meta">
        <h1 class="race-title-main">
          根岸ステークス <span class="grade-label gG3">G3</span>
        </h1>

		<!-- レース予想リンク表示位置 -->
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
		<a href="https://note.com/coro_pepa/n/n20260201_negishi" target="_blank" rel="noopener" class="text-banner-link">
		  <div class="text-banner">
		    <p class="text-banner-line"></p>
		    <p class="text-banner-line"></p>
		  </div>
		</a>

      </div>
    </div>

    <!-- 🎯 見どころ -->
    <section class="race-section highlight">
      <h3>🎯 見どころ</h3>
      <p><p>フェブラリーSの前哨戦・根岸Sは<strong>東京ダ1400m</strong>で行われるスピード重視の一戦。<strong>芝スタート＋末脚勝負</strong>が鍵となるダート短距離戦です。</p></p>
    </section>

    <!-- 📊 展開予想 -->
    <section class="race-section preview">
      <h3>📊 展開予想</h3>

      <div class="preview-text">
        {{preview_text}}
      </div>
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
	    <a href="https://note.com/coro_pepa/n/n20260201_negishi" class="banner-wrapper" target="_blank" rel="noopener">
	      <div class="banner-content">
	        <div class="banner-grade">G3</div>
	        <img src="../images/20250727_sekiya.png" alt="競走馬" class="banner-horse" />
	        <div class="banner-text">
	          <p class="banner-line"></p>
	          <p class="banner-line"></p>
	        </div>
	      </div>
	    </a>
    </section>


    <!-- 🐎 レース回顧 -->
    <section class="race-section review">
      <h3>🐎 レース回顧</h3>
      {{review}}
    </section>

    <footer>
      <a href="../index.html">🏠 トップページへ戻る</a>
    </footer>
  </article>
</body>
</html>
