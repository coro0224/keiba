<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ホープフルステークス（GG1）</title>
  <link rel="stylesheet" href="../styles-race.css" />
  <link rel="stylesheet" href="../common.css" />
</head>
<body>
  <article class="race-detail">

    <!-- 🏇 レース画像＆ヘッダー -->
    <div class="race-header">
      <img src="../images/{{image_name}}" alt="ホープフルステークス G1" class="race-mainvisual" />

      <div class="race-meta">
        <h1 class="race-title-main">
          ホープフルステークス <span class="grade-label gG1">G1</span>
        </h1>

		<!-- レース予想リンク表示位置 -->
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
		<a href="" target="_blank" rel="noopener" class="text-banner-link">
		  <div class="text-banner">
		    <p class="text-banner-line">{{text_banner1}}</p>
		    <p class="text-banner-line">{{text_banner2}}</p>
		  </div>
		</a>

      </div>
    </div>

    <!-- 🎯 見どころ -->
    <section class="race-section highlight">
      <h3>🎯 見どころ</h3>
      <p></p>
    </section>

    <!-- 📊 展開予想 -->
    <section class="race-section preview">
      <h3>📊 展開予想</h3>

      <div class="preview-text">
        {{preview_text}}
      </div>
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
	    <a href="" class="banner-wrapper" target="_blank" rel="noopener">
	      <div class="banner-content">
	        <div class="banner-grade">G1</div>
	        <img src="{{horse_image_path}}" alt="競走馬" class="banner-horse" />
	        <div class="banner-text">
	          <p class="banner-line">{{text_banner1}}</p>
	          <p class="banner-line">{{text_banner2}}</p>
	        </div>
	      </div>
	    </a>
    </section>


    <!-- 🐎 レース回顧 -->
    <section class="race-section review">
      <h3>🐎 レース回顧</h3>
      {{review}}
    </section>

    <footer>
      <a href="../index.html">🏠 トップページへ戻る</a>
    </footer>
  </article>
</body>
</html>
