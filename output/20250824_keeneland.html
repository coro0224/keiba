<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>キーンランドカップ（GG3）</title>
  <link rel="stylesheet" href="../styles-race.css" />
  <link rel="stylesheet" href="../common.css" />
</head>
<body>
  <article class="race-detail">

    <!-- 🏇 レース画像＆ヘッダー -->
    <div class="race-header">
      <img src="../images/{{image_name}}" alt="キーンランドカップ G3" class="race-mainvisual" />

      <div class="race-meta">
        <h1 class="race-title-main">
          キーンランドカップ <span class="grade-label gG3">G3</span>
        </h1>

		<!-- レース予想リンク表示位置 -->
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
		<a href="https://note.com/coro_pepa/n/nee8b2b2bbada" target="_blank" rel="noopener" class="text-banner-link">
		  <div class="text-banner">
		    <p class="text-banner-line">秋のスプリント戦線を占う一戦──キーンランドカップ</p>
		    <p class="text-banner-line">キーンランドカップのデータ予想＋買い目はこちら</p>
		  </div>
		</a>

      </div>
    </div>

    <!-- 🎯 見どころ -->
    <section class="race-section highlight">
      <h3>🎯 見どころ</h3>
      <p><p><strong>キーンランドカップ</strong>は札幌芝1200mで行われる<strong>夏のスプリント重賞</strong。<strong>サマースプリントシリーズ終盤戦</strongに位置づけられ、<strong>秋のG1戦線への重要ステップ</strongとして注目される一戦です。<strong>洋芝適性</strongや<strong>展開力</strongが勝敗を左右し、<strong>牝馬の好走率が高い傾向</strongも見逃せません。例年、<strong>前走函館SS組や札幌実績馬</strongが上位を賑わせ、<strong>差し馬の台頭</strongも十分。<strong>枠順や馬場状態</strongによって勢力図が大きく変わるため、<strong>波乱含みの一戦</strongとしても注目されています。</p></p>
    </section>

    <!-- 📊 展開予想 -->
    <section class="race-section preview">
      <h3>📊 展開予想</h3>

      <div class="preview-text">
        <div class='note-preview'></div>
      </div>
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
	    <a href="https://note.com/coro_pepa/n/nee8b2b2bbada" class="banner-wrapper" target="_blank" rel="noopener">
	      <div class="banner-content">
	        <div class="banner-grade">G3</div>
	        <img src="../images/20250824_keeneland.png" alt="競走馬" class="banner-horse" />
	        <div class="banner-text">
	          <p class="banner-line">秋のスプリント戦線を占う一戦──キーンランドカップ</p>
	          <p class="banner-line">キーンランドカップのデータ予想＋買い目はこちら</p>
	        </div>
	      </div>
	    </a>
    </section>


    <!-- 🐎 レース回顧 -->
    <section class="race-section review">
      <h3>🐎 レース回顧</h3>
      {{review}}
    </section>

    <footer>
      <a href="../index.html">🏠 トップページへ戻る</a>
    </footer>
  </article>
</body>
</html>
