<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>京都金杯（GG3）</title>
  <link rel="stylesheet" href="../styles-race.css" />
  <link rel="stylesheet" href="../common.css" />
</head>
<body>
  <article class="race-detail">

    <!-- 🏇 レース画像＆ヘッダー -->
    <div class="race-header">
      <img src="../images/{{image_name}}" alt="京都金杯 GG3" class="race-mainvisual" />

      <div class="race-meta">
        <h1 class="race-title-main">
          京都金杯 <span class="grade-label gG3">GG3</span>
        </h1>

		<!-- レース予想リンク表示位置 -->
		<a href="https://note.com/coro_pepa/n/n20260104_kyoto_kinpai" target="_blank" rel="noopener" class="text-banner-link">
		  <div class="text-banner">
		    {% for line in lead_banner_text %}
		      <p class="text-banner-line">{{ line }}</p>
		    {% endfor %}
		  </div>
		</a>

      </div>
    </div>

    <!-- 🎯 見どころ -->
    <section class="race-section highlight">
      <h3>🎯 見どころ</h3>
      <p><p>京都金杯は開幕週の京都芝1600mで行われるハンデ戦。<strong>内枠先行有利</strong>の傾向が強く、<strong>スピードと器用さ</strong>が問われるマイル重賞です。</p></p>
    </section>

    <!-- 📊 展開予想 -->
    <section class="race-section preview">
      <h3>📊 展開予想</h3>

      <div class="preview-text">
        {{preview_text}}
      </div>
		<!-- レース予想リンク表示位置 -->
		<a href="https://note.com/coro_pepa/n/n20260104_kyoto_kinpai" target="_blank" rel="noopener" class="text-banner-link">
		  <div class="text-banner">
		    {% for line in lead_banner_text %}
		      <p class="text-banner-line">{{ line }}</p>
		    {% endfor %}
		  </div>
		</a>
    </section>


    <!-- 🐎 レース回顧 -->
    <section class="race-section review">
      <h3>🐎 レース回顧</h3>
      {{review}}
    </section>

    <footer>
      <a href="../index.html">🏠 トップページへ戻る</a>
    </footer>
  </article>
</body>
</html>
