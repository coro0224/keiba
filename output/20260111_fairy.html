<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>フェアリーステークス（GG3）</title>
  <link rel="stylesheet" href="../styles-race.css" />
  <link rel="stylesheet" href="../common.css" />
</head>
<body>
  <article class="race-detail">

    <!-- 🏇 レース画像＆ヘッダー -->
    <div class="race-header">
      <img src="../images/{{image_name}}" alt="フェアリーステークス G3" class="race-mainvisual" />

      <div class="race-meta">
        <h1 class="race-title-main">
          フェアリーステークス <span class="grade-label gG3">G3</span>
        </h1>

		<!-- レース予想リンク表示位置 -->
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
		<a href="https://note.com/coro_pepa/n/n20260111_fairy" target="_blank" rel="noopener" class="text-banner-link">
		  <div class="text-banner">
		    <p class="text-banner-line"></p>
		    <p class="text-banner-line"></p>
		  </div>
		</a>

      </div>
    </div>

    <!-- 🎯 見どころ -->
    <section class="race-section highlight">
      <h3>🎯 見どころ</h3>
      <p><p><strong>フェアリーステークス</strong>は中山芝1600mで行われる<strong>3歳牝馬クラシック戦線の開幕重賞</strong。<strong>波乱度の高い牝馬限定マイル戦</strongで、<strong>1番人気が過去10年で0勝・穴馬台頭が多い</strongのが特徴。今年は<strong>函館で2歳コースレコード勝ちのブラックチャリス</strong、<strong>中山マイル新馬を上がり最速で差し切ったギリーズボール</strong、<strong>京王杯2歳Sで上がり最速のトワニ</strongなど<strong>差し脚自慢の有力馬</strongが揃う。さらに<strong>新馬・未勝利組の上昇度が鍵</strongで、<strong>抽選突破組の伏兵が激走する可能性も高い</strong。<strong>差し優勢＋枠はフラット傾向</strongのため、<strong>ペースと馬場読みが勝敗を左右</strongする一戦です。</p></p>
    </section>

    <!-- 📊 展開予想 -->
    <section class="race-section preview">
      <h3>📊 展開予想</h3>

      <div class="preview-text">
        {{preview_text}}
      </div>
		<!-- ✅ 修正済み：レース予想リンク表示位置 -->
	    <a href="https://note.com/coro_pepa/n/n20260111_fairy" class="banner-wrapper" target="_blank" rel="noopener">
	      <div class="banner-content">
	        <div class="banner-grade">G3</div>
	        <img src="../images/20250727_sekiya.png" alt="競走馬" class="banner-horse" />
	        <div class="banner-text">
	          <p class="banner-line"></p>
	          <p class="banner-line"></p>
	        </div>
	      </div>
	    </a>
    </section>


    <!-- 🐎 レース回顧 -->
    <section class="race-section review">
      <h3>🐎 レース回顧</h3>
      {{review}}
    </section>

    <footer>
      <a href="../index.html">🏠 トップページへ戻る</a>
    </footer>
  </article>
</body>
</html>
